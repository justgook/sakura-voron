# https://github.com/jontek2/A-better-print_start-macro
[gcode_macro PRINT_START]
gcode:
  # This part fetches data from your slicer. Such as bed, extruder, and chamber temps and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("45")|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
  BED_MESH_CLEAR                                       # Clear old saved bed mesh (if any)

  # SET_HEATER_TEMPERATURE HEATER=extruder TARGET=150
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={target_bed}
  # Home the printer, set absolute positioning and update the Stealthburner LEDs.
  G28                                                  # Full home (XYZ)
  G90                                                  # Absolute position

  SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Display info on display
  STATUS_HEATING                                      # Set LEDs to heating-mode
  G1 X{x_wait} Y{y_wait} Z15 F9000                    # Go to center of the bed
  M190 S{target_bed}                                  # Set the target temp for the bed

  # Heat hotend to 150c. This helps with getting a correct Z-home.
  SET_DISPLAY_TEXT MSG="Hotend: 150c"                   # Display info on display
  STATUS_HEATING
  M109 S150                                             # Heat hotend to 150c
  ##  Quad gantry level AKA QGL
  QUAD_GANTRY_LEVEL                                    # Level the printer via QGL
  # G28 Z                                               # Home Z again after QGL
  # Use nozzle contact to establish the final Z reference.
  G1 X{x_wait} Y{y_wait} Z15 F9000                      # Go to center of the bed
  SET_Z_FROM_PROBE METHOD=tap SAMPLES=3 SAMPLES_RESULT=median SAMPLES_TOLERANCE=0.025 SAMPLES_TOLERANCE_RETRIES=3 SAMPLE_RETRACT_DIST=4 PROBE_SPEED=5 LIFT_SPEED=5
  
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={target_extruder} #preheat nozzle durring mesh calibration
  
  BED_MESH_CALIBRATE                                   # Start the bed mesh (add ADAPTIVE=1) for adaptive bed mesh
  
  # Heat up the hotend up to target via data from slicer

  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"     # Display info on display
  STATUS_HEATING                                        # Set LEDs to heating-mode
  G1 X{x_wait} Y{y_wait} Z15 F9000                      # Go to center of the bed
  M107                                                  # Turn off partcooling fan
  M109 S{target_extruder}                               # Heat the hotend to set temp


[gcode_macro PRIME_LINE]
description: Prime the nozzle after Happy Hare loads the initial tool
gcode:
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set messages = [
        "Compiling object in real life…",
        "Please stand by: atoms downloading…",
        "Hot glue gun on steroids: ENGAGED",
        "Summoning plastic wizardry…",
        "Deploying spaghetti factory",
        "Extruding optimism…",
        "Layering like an onion"
  ] %}
  {% set msg = messages | random %}
  SET_DISPLAY_TEXT MSG="{msg}"
  STATUS_PRINTING
  G90
  G0 X{x_wait - 50} Y4 F10000
  G0 Z0.4
  G91
  G1 X100 E20 F1000
  G90


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customize for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-4.0 F3600                 ; retract filament

    TURN_OFF_HEATERS
    M107                           ; turn off fan

    # Lift by at most 10mm, route around the rear hardware, and approach the
    # silicone park at X45 Y347.5 from left to right.
    NOZZLE_STATION_PARK Z_HOP=10

    M84
    # SET_FAN_SPEED FAN=filter_fan SPEED=0
    M117 Done

    BED_MESH_CLEAR
