# Rear nozzle station geometry and reusable movement primitives.
#
# Layout at Y=347.5:
#   purge area:     X10-X30 (not used by these initial primitives)
#   silicone park:  X45
#   brush:          X55-X90
#   right exit:     X110
#
# These macros are intentionally not wired into Happy Hare or PRINT_END yet.

[gcode_macro _NOZZLE_STATION_VARS]
description: Shared geometry for the rear nozzle station
variable_station_y: 347.5
variable_clear_y: 337.5
variable_approach_x: 30.0
variable_park_x: 45.0
variable_brush_left: 55.0
variable_brush_right: 90.0
variable_exit_x: 110.0
variable_default_z_hop: 10.0
variable_travel_speed: 150.0
variable_brush_speed: 80.0
variable_default_clean_cycles: 2
gcode:


[gcode_macro NOZZLE_STATION_PARK]
description: Safely approach the rear silicone park from left to right
gcode:
    {% set vars = printer['gcode_macro _NOZZLE_STATION_VARS'] %}
    {% set z_hop = params.Z_HOP|default(vars.default_z_hop)|float %}
    {% set travel_f = vars.travel_speed|float * 60 %}
    {% set lift_f = 15.0 * 60 %}
    {% set current_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set remaining_z = [max_z - current_z, 0.0]|max %}
    {% set lift = [[z_hop, 0.0]|max, remaining_z]|min %}

    {% if 'xyz' not in printer.toolhead.homed_axes %}
        {action_raise_error('NOZZLE_STATION_PARK requires XYZ to be homed')}
    {% endif %}

    SAVE_GCODE_STATE NAME=NOZZLE_STATION_PARK_STATE

    # Lift vertically before crossing the printed area. Near Z maximum the
    # movement is clamped to the remaining available travel.
    {% if lift > 0 %}
        G91
        G0 Z{lift} F{lift_f}
    {% endif %}

    # First leave the hardware row, then route to its left side. This avoids
    # crossing the silicone park or brush backwards when starting on the right.
    G90
    G0 Y{vars.clear_y} F{travel_f}
    G0 X{vars.approach_x} F{travel_f}
    G0 Y{vars.station_y} F{travel_f}
    G0 X{vars.park_x} F{travel_f}

    RESTORE_GCODE_STATE NAME=NOZZLE_STATION_PARK_STATE MOVE=0


[gcode_macro NOZZLE_STATION_CLEAN]
description: Wipe the nozzle across the rear brush and exit to its right
# CYCLES is the number of complete right-left brush cycles. The macro performs
# one final left-to-right stroke before exiting at X110.
gcode:
    {% set vars = printer['gcode_macro _NOZZLE_STATION_VARS'] %}
    {% set cycles = params.CYCLES|default(vars.default_clean_cycles)|int %}
    {% set travel_f = vars.travel_speed|float * 60 %}
    {% set brush_f = vars.brush_speed|float * 60 %}
    {% set current_x = printer.toolhead.position.x|float %}
    {% set current_y = printer.toolhead.position.y|float %}
    {% set on_left_of_station = current_x <= vars.brush_left|float %}
    {% set on_station_y = (current_y - vars.station_y|float)|abs < 0.5 %}

    {% if 'xy' not in printer.toolhead.homed_axes %}
        {action_raise_error('NOZZLE_STATION_CLEAN requires XY to be homed')}
    {% endif %}
    {% if cycles < 1 or cycles > 10 %}
        {action_raise_error('NOZZLE_STATION_CLEAN CYCLES must be between 1 and 10')}
    {% endif %}

    SAVE_GCODE_STATE NAME=NOZZLE_STATION_CLEAN_STATE
    G90

    # If already parked or in the purge area, continue directly from the left.
    # Otherwise clear the hardware row and re-enter from its left side.
    {% if not (on_left_of_station and on_station_y) %}
        G0 Y{vars.clear_y} F{travel_f}
        G0 X{vars.approach_x} F{travel_f}
        G0 Y{vars.station_y} F{travel_f}
    {% endif %}

    G0 X{vars.brush_left} F{travel_f}
    {% for _ in range(cycles) %}
        G0 X{vars.brush_right} F{brush_f}
        G0 X{vars.brush_left} F{brush_f}
    {% endfor %}

    # Finish with a rightward wipe and leave the brush from its right side.
    G0 X{vars.brush_right} F{brush_f}
    G0 X{vars.exit_x} F{travel_f}

    RESTORE_GCODE_STATE NAME=NOZZLE_STATION_CLEAN_STATE MOVE=0
