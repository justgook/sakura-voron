[gcode_macro EDDY_DRIVE_CURRENT_CALIBRATE]
description: Calibrate the BTT Eddy LDC1612 drive current
gcode:
  LDC_CALIBRATE_DRIVE_CURRENT CHIP=btt_eddy

[gcode_macro EDDY_CALIBRATE]
description: Calibrate the BTT Eddy height-to-frequency mapping
gcode:
  PROBE_EDDY_CURRENT_CALIBRATE CHIP=btt_eddy {rawparams}

[gcode_macro EDDY_TAP_CALIBRATE]
description: Calibrate mainline Klipper Eddy tap detection (TAP=guess|refine|verify)
gcode:
  PROBE_EDDY_CURRENT_TAP_CALIBRATE {rawparams}

[gcode_macro _RELOAD_Z_OFFSET_FROM_PROBE]
description: Apply the most recent probe result to the Z coordinate frame
gcode:
  {% set z = printer.toolhead.position.z %}
  SET_KINEMATIC_POSITION Z={z - printer.probe.last_probe_position.z}

[gcode_macro SET_Z_FROM_PROBE]
description: Probe and apply its result to the Z coordinate frame
# Keep this as two macros: Klipper renders a macro before executing its commands.
gcode:
  PROBE {rawparams}
  M400
  _RELOAD_Z_OFFSET_FROM_PROBE
  G90
  G0 Z5 F1000
